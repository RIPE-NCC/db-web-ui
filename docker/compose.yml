services:
    db-web-ui:
        build:
            context: ../
            dockerfile: ${PWD}/docker/Dockerfile
            args:
                # Same CI image as the pipeline build/test jobs
                - BUILD_IMAGE=${WHOIS_BUILD_IMAGE:-docker-registry.ripe.net/swe-database-team/gitlab-ci/whois-build:v0.0.15}
                - CI_COMMIT_SHA=local
        environment:
            - PROFILE=local
            # http2 off: conscrypt (ALPN) ships no arm64 native; alternatively set platform: linux/amd64
            - SERVER_HTTP2_ENABLED=false
            - START_HEAP_SIZE=256m
            - MAX_HEAP_SIZE=2g
            - ENABLE_JMX_EXPORTER=true
            # - LOGGING_CONFIG=/app/resources/logback.xml
        volumes:
            - $PWD/backend/src/main/resources/config/application-local.properties:/app/resources/application-local.properties:ro
            - $PWD/backend/src/main/resources/menu.properties:/app/resources/menu.properties:ro
            # - ./conf/logback.xml:/app/resources/logback.xml:ro
            # - ./logs:/app/var/logs:rw
        ports:
            - "1082:1082" # http
            - "8443:8443" # https
            - "9090:9090" # Victoria Metrics
