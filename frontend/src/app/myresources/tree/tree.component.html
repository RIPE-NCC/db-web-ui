<mat-tree #tree [dataSource]="dataSource()" [childrenAccessor]="childrenAccessor">
    <!--  Node without children  -->
    <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
        <button matIconButton disabled></button>
        <div class="node-content">
            <mat-icon matSuffix class="fa-solid fa-circle-small ok" [class.issue]="true"></mat-icon>
            <name-formatter [name]="node.resource" [type]="node.type"></name-formatter>
            {{ node.netname }}
        </div>
    </mat-tree-node>
    <!--  Node with banner, more then 10 children  -->
    <mat-tree-node *matTreeNodeDef="let node; when: isScalabilityBanner">
        <button matIconButton disabled></button>
        <banner [type]="BannerTypes.informational" [title]="'Scalability: Large allocations'" [textContent]="scalabilityMsg" [permanent]="true"></banner>
    </mat-tree-node>
    <!--  Node with 'show more' button, more then 10 children  -->
    <mat-tree-node *matTreeNodeDef="let node; when: isShowMore">
        <button matIconButton disabled></button>

        <button type="button" matButton (click)="showMore(node)">
            <mat-icon class="fa-light fa-chevron-right"></mat-icon>
            Show {{ node.remaining }} more assignments
        </button>
    </mat-tree-node>
    <!--  Node with all children  -->
    <mat-tree-node
        *matTreeNodeDef="let node; when: hasChild"
        matTreeNodePadding
        matTreeNodeToggle
        [cdkTreeNodeTypeaheadLabel]="node.resource"
        (expandedChange)="onNodeExpanded(node, $event)"
    >
        <button matIconButton [attr.aria-label]="'Toggle ' + node.resource" matTreeNodeToggle>
            @if (tree.isExpanded(node)) {
            <mat-icon matSuffix class="fa-light fa-minus"></mat-icon> } @else { <mat-icon matSuffix class="fa-light fa-plus"></mat-icon> }
        </button>
        <div class="node-content">
            <mat-icon class="fa-solid fa-circle-small ok" [class.issue]="false"></mat-icon>
            <name-formatter [name]="node.resource" [type]="node.type"></name-formatter>
            {{ node.netname }}
            ({{ node.used }}% used)
        </div>
        @if (node.isLoading()) {
        <mat-progress-bar mode="indeterminate" class="example-tree-progress-bar"></mat-progress-bar>
        }
    </mat-tree-node>
</mat-tree>
