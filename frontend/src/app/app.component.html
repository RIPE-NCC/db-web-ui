@if (isComponentLoaded && !this.properties.isProdEnv()) {
<ripe-unified-layout
    class="layout-overrides"
    [attr.service-logo]="icon"
    [attr.active-app]="activeMenu"
    home-url="/"
    [menu]="sidebarMenu"
    (:ripe-unified-sidebar:item-clicked)="onSidebarItemClick($event)"
    [attr.active-route]="activeSidebarItem"
    [attr.env]="envNameInRipeWebComponents"
    [attr.env-label-img]="labelEnvImg"
    [attr.env-label-title]="labelEnv"
    [attr.user-logged-in]="isLoggedInUser"
    [attr.user-login-url]="currentHref"
    [attr.user-logout-url]="'/db-web-ui/logout'"
    [attr.user-picture]="properties.LOGIN_URL + '/picture/' + profilePhotoId"
    [attr.user-name]="usernameOidc"
    [attr.user-profile-url]="properties.LOGIN_URL + '/profile'"
    [attr.user-auth]="'custom'"
>
    <section slot="main">
        @if (properties.isTestEnv()) {
        <a class="link-back-test-db" href="https://apps.db.ripe.net/db-web-ui/query"><em class="fa-light fa-arrow-left"></em> Back to RIPE Database</a>
        }
        <main-container></main-container>
    </section>
</ripe-unified-layout>
} @else if (isComponentLoaded) {
<ripe-unified-layout
    class="layout-overrides"
    [attr.service-logo]="icon"
    [attr.active-app]="activeMenu"
    home-url="/"
    [menu]="sidebarMenu"
    (:ripe-unified-sidebar:item-clicked)="onSidebarItemClick($event)"
    [attr.active-route]="activeSidebarItem"
    [attr.env]="envNameInRipeWebComponents"
    [attr.user-logged-in]="isLoggedInUser"
    [attr.user-login-url]="currentHref"
    [attr.user-logout-url]="'/db-web-ui/logout'"
    [attr.user-picture]="properties.LOGIN_URL + '/picture/' + profilePhotoId"
    [attr.user-name]="usernameOidc"
    [attr.user-profile-url]="properties.LOGIN_URL + '/profile'"
    [attr.user-auth]="'custom'"
>
    <section slot="main"><main-container></main-container></section>
</ripe-unified-layout>
}
