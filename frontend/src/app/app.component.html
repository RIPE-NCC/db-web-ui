@if(currentHref) { @if (!this.properties.isProdEnv()) {
<ripe-unified-layout
    class="layout-overrides"
    [attr.service-logo]="icon"
    [attr.active-app]="activeMenu"
    home-url="/"
    [menu]="sidebarMenu"
    (:ripe-unified-sidebar:item-clicked)="onSidebarItemClick($event)"
    [attr.active-route]="activeSidebarItem"
    [attr.env]="'prepdev'"
    [attr.env-label-img]="labelEnvImg"
    [attr.env-label-title]="labelEnv"
    [attr.user-logged-in]="'false'"
    [attr.user-login-url]="currentHref"
    [attr.user-logout-url]="'/logout'"
    [attr.user-picture]="currentHref"
    [attr.user-name]="properties.LOGIN_URL"
    [attr.user-profile-url]="properties.LOGIN_URL"
    [attr.user-auth]="'custom'"
>
    <section slot="main"><main-container></main-container></section>
</ripe-unified-layout>
} @else {
<ripe-unified-layout
    class="layout-overrides"
    [attr.service-logo]="icon"
    [attr.active-app]="activeMenu"
    home-url="/"
    [menu]="sidebarMenu"
    (:ripe-unified-sidebar:item-clicked)="onSidebarItemClick($event)"
    [attr.active-route]="activeSidebarItem"
    [attr.env]="envNameInRipeWebComponents"
    user-auth="custom"
>
    <section slot="main"><main-container></main-container></section>
</ripe-unified-layout>
} }
