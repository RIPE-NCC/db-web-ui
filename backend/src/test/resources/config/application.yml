server:
    port: 10344
    address: localhost


# security configuration (this key should be unique for your application, and kept secret)
jhipster.security.rememberme.key: 207975aa5cacf1a547198dd6d0997edf03c2ae50

async:
    corePoolSize: 2
    maxPoolSize: 50
    queueCapacity: 10000

spring:
    security:
        oauth2:
            client:
                registration:
                    keycloak:
                        client-id: test
                        client-secret: test
                        authorization-grant-type: authorization_code
                        redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
                        scope: openid
                provider:
                    keycloak:
                        authorization-uri: http://localhost/auth
                        token-uri: http://localhost/token
                        user-info-uri: http://localhost/userinfo
                        user-name-attribute: sub

